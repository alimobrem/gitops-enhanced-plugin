plugin:
  name: gitops-enhanced
  image: image-registry.openshift-image-registry.svc:5000/gitops-enhanced-plugin/gitops-enhanced-plugin:latest
  replicas: 1
  port: 9443
  resources:
    requests:
      cpu: 1m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

argocd:
  # Multi-instance: define each ArgoCD instance as a proxy alias.
  # The alias is used in API calls: /api/proxy/plugin/gitops-enhanced/<alias>
  instances:
    - alias: argocd
      namespace: openshift-gitops
      serviceName: openshift-gitops-server
      port: 443
