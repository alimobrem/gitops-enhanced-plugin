apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.plugin.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.plugin.name }}
    app.kubernetes.io/part-of: gitops-enhanced
spec:
  replicas: {{ .Values.plugin.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.plugin.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.plugin.name }}
    spec:
      containers:
        - name: plugin
          image: {{ .Values.plugin.image }}
          ports:
            - containerPort: 9443
              protocol: TCP
          resources:
            {{- toYaml .Values.plugin.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: plugin-serving-cert
              readOnly: true
              mountPath: /var/serving-cert
      volumes:
        - name: nginx-config
          configMap:
            name: {{ .Values.plugin.name }}-nginx
        - name: plugin-serving-cert
          secret:
            secretName: {{ .Values.plugin.name }}-serving-cert
            defaultMode: 420
