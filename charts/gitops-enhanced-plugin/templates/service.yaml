apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.plugin.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.plugin.name }}
    app.kubernetes.io/part-of: gitops-enhanced
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ .Values.plugin.name }}-serving-cert
spec:
  ports:
    - name: {{ .Values.plugin.port | quote }}
      port: {{ .Values.plugin.port }}
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: {{ .Values.plugin.name }}
  type: ClusterIP
